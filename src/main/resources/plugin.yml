name: ServerPlugin
version: 1.0.0
main: net.minenite.serverplugin.ServerPlugin
api-version: '1.21'
author: icedmoca
description: Core plugin for the network - friends, friendly fire and cross-server travel.

commands:
  friend:
    description: Core plugin for the network - friends, friendly fire and cross-server travel.
    usage: /friend [username]
    aliases: [friends]
  msg:
    description: Send a private message to a player on any server.
    usage: /msg <username> <message>
    aliases: [w, tell, whisper]
  setrank:
    description: Set a player's rank across the network. SMOD and above, or operators.
    usage: /setrank <username> <rank>
  setspawn:
    description: Set where arrivals are put on this server. DEV and above.
    usage: /setspawn
  silentjoin:
    description: Toggle arriving and leaving unannounced. TMOD and above.
    usage: /silentjoin
  tag:
    description: Display a rank at or below your own.
    usage: /tag <rank>
  join:
    description: Core plugin for the network - friends, friendly fire and cross-server travel.
    usage: /join <username>
